[project]
name = "tiraz-garment-completion"
version = "0.1.0"
description = "Annotation-only garment completion, calibration, and missing-context evaluation"
requires-python = ">=3.12"
dependencies = ["numpy>=2,<3", "torch>=2.8,<3", "ijson>=3.4,<4"]

[project.scripts]
tiraz-completion = "tiraz_completion.run:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.18,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiraz_completion"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tiraz_completion"]
[[tool.mypy.overrides]]
module = ["ijson", "ijson.*"]
ignore_missing_imports = true
